<mat-toolbar color="primary">
  <span>HomeTask</span>

  <span class="spacer"></span>

  <button mat-button routerLink="/">Home</button>
  <button mat-button routerLink="/register">Criar conta</button>
</mat-toolbar>

<div class="login-container">
  <mat-card class="login-card">

    <mat-card-header>
      <mat-card-title>Entrar</mat-card-title>
      <mat-card-subtitle>
        Acesse suas tarefas domésticas
      </mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form class="form">

        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <label>
            <input matInput type="email" />
          </label>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Senha</mat-label>
          <label>
            <input matInput type="password" />
          </label>
        </mat-form-field>

        <button
          mat-raised-button
          color="primary"
          class="login-button"
        >
          Entrar
        </button>

        <div class="divider">
          <span>ou</span>
        </div>

        <div class="google-login">
          <div id="googleBtn"></div>
        </div>

        <div class="register-link">
          Não tem conta?
          <a routerLink="/register">Criar agora</a>
        </div>

      </form>
    </mat-card-content>

  </mat-card>
</div>
